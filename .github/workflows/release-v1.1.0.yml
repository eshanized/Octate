name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v1.1.0.md

permissions:
  contents: write

concurrency:
  group: github-release-v1.1.0
  cancel-in-progress: false

jobs:
  release:
    name: Create v1.1.0 GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "1.1.0" ]; then
            echo "::error::Refusing to publish v1.1.0 because package.json reports $package_version."
            exit 1
          fi
          test -s CHANGELOG.md
          test -s docs/releases/v1.1.0.md

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "::notice::GitHub Release v1.1.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v1.1.0 \
            --target "$GITHUB_SHA" \
            --title "Octate v1.1.0" \
            --notes-file docs/releases/v1.1.0.md
