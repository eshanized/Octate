name: 🐛 Bug Report
description: File a bug report or review engine defect
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Octate!
  - type: input
    id: version
    attributes:
      label: Octate Version
      description: What version of Octate are you running? (Run `octate --version`)
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Node Version
      description: OS and Node runtime (e.g. Linux x64, Node v22.12.0)
      placeholder: Linux x64, Node v22.12.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `octate doctor`
      description: Please paste the output of `octate doctor` run in your repository.
      render: bash
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or unexpected behavior encountered.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Relevant Code or Diff Sample
      description: If this is a false positive or missed defect, provide the relevant code snippet or diff.
      render: typescript
